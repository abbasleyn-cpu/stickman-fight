<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stickman Fight Online</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-container {
      width: min(1100px, 96vw);
      text-align: center;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 34px;
    }

    .topbar {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    input {
      width: 160px;
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      text-align: center;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.85;
    }

    #createBtn {
      background: #2ecc71;
      color: white;
    }

    #joinBtn {
      background: #3498db;
      color: white;
    }

    #status {
      margin: 10px 0;
      min-height: 24px;
      font-size: 17px;
    }

    canvas {
      width: 100%;
      max-width: 1000px;
      height: auto;
      border: 3px solid white;
      border-radius: 12px;
      background: #222;
      display: block;
      margin: 0 auto;
    }

    .controls {
      margin-top: 12px;
      font-size: 15px;
      line-height: 1.7;
      color: #ccc;
    }

    .room {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #restartBtn {
      display: none;
      margin-top: 10px;
      background: #e67e22;
      color: white;
    }
  </style>
</head>

<body>
  <div class="game-container">

    <h1>🥊 Stickman Fight Online</h1>

    <div class="topbar">
      <button id="createBtn">Raum erstellen</button>

      <input
        id="roomInput"
        type="text"
        maxlength="6"
        placeholder="Raumcode"
      >

      <button id="joinBtn">Beitreten</button>
    </div>

    <div class="room">
      Raum: <span id="roomCode">---</span>
    </div>

    <div id="status">
      Verbinde mit Server...
    </div>

    <canvas id="gameCanvas" width="1000" height="550"></canvas>

    <button id="restartBtn">Neue Runde</button>

    <div class="controls">
      <strong>Spieler 1:</strong>
      A = links, D = rechts, W = springen, F = schlagen, G = treten
      <br>

      <strong>Spieler 2:</strong>
      ← = links, → = rechts, ↑ = springen, Numpad 1 = schlagen, Numpad 2 = treten
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
